<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Diary</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#1f2a2e;--mute:#5d6b70;--line:#cbd5d1;--tool:#0f766e;--card:#b45309;--contact:#3b5bdb;--note:#6b7280;--waste:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:22px;margin:0 0 14px;font-weight:600}
.search{width:100%;padding:14px 16px;font:inherit;font-size:18px;border:2px solid var(--ink);border-radius:8px;background:var(--panel)}
.search:focus,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.row:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.show-all{border:1px solid var(--ink);border-radius:6px;background:var(--panel);padding:8px 14px;font:inherit;cursor:pointer;margin:2px 0 12px}
.best{background:var(--panel);border-left:5px solid var(--card);padding:10px 14px;border-radius:6px;margin:12px 0}
.best b{font-weight:600}
.best ol{margin:6px 0 0;padding-left:20px}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;background:var(--panel);border-radius:8px;margin-bottom:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;padding:0}
.row>i{display:block}
.row .body{padding:10px 0}
.row .t{font-weight:600}
.row .d{color:var(--mute);font-size:14px;white-space:pre-line}
.row .tags{font-size:13px;color:var(--mute);margin-top:2px}
.row .side{padding:10px 14px;font-weight:600;font-size:20px;align-self:center}
.stepper{display:flex;align-items:center;gap:6px}.step{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:#fff;font:inherit;font-size:20px;line-height:1;cursor:pointer;padding:0;color:var(--ink)}.step:active{background:var(--line)}.q{min-width:26px;text-align:center}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.notice{background:#fff7e0;border:1px solid #e8c766;padding:8px 12px;border-radius:6px;font-size:14px;margin-bottom:12px}
.fab{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:0;border-radius:10px;padding:20px;width:min(480px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(20,30,30,.5)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:80px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{padding:10px 16px;font:inherit;border-radius:6px;border:1px solid var(--ink);background:#fff;cursor:pointer}
.actions .primary{background:var(--ink);color:#fff}
.actions .danger{margin-left:auto;color:#b42318;border-color:#b42318}
input[type=checkbox]{width:auto}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line)}
nav a{padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent;font-weight:500}
nav a[aria-current=page]{border-color:var(--ink);font-weight:600}
nav a:focus-visible,.row a:focus-visible,.linkbtn:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.row a{color:#1d4ed8}
.tick{width:26px;height:26px;cursor:pointer}
.strip{background:var(--panel);border-left:5px solid #b42318;padding:10px 14px;border-radius:6px;margin:0 0 12px}
.strip ul{margin:6px 0 0;padding-left:18px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer;text-align:left}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.tools button{padding:8px 14px;font:inherit;font-size:14px;border:1px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}.row:hover{border-color:var(--ink)}}
</style>
</head>
<body>
<main>
  <h1>Smart Diary</h1>
  <nav id="nav" aria-label="Pages"></nav>
  <div id="notice"></div>
  <div id="strips"></div>
  <input id="q" class="search" type="search" placeholder="Search tools, cards, contacts, items to sell…" autocomplete="off">
  <div class="chips" id="types" role="group" aria-label="Filter by type"></div>
  <div class="chips" id="tags" role="group" aria-label="Filter by tag"></div>
  <button type="button" class="show-all" id="showAll" aria-expanded="false">Show all</button>
  <div id="best"></div>
  <div id="list"></div>
  <!-- EXPORT/IMPORT DISABLED until email login is added (re-enable together with the JS block at the bottom)
  <div class="tools"><button id="expJson" type="button">Export JSON</button><button id="expCsv" type="button">Export CSV</button><button id="impBtn" type="button">Import JSON</button><input id="impFile" type="file" accept="application/json,.json" hidden></div>
  -->
</main>
<button class="fab" id="add">+ Add entry</button>

<dialog id="dlg">
  <form method="dialog" id="form" onsubmit="return false">
    <h2 id="dlgTitle" style="margin:0 0 4px;font-size:18px">Add entry</h2>
    <label for="f_type">Type</label>
    <select id="f_type"></select>
    <label for="f_title">Name</label>
    <input id="f_title" required>
    <div id="dyn"></div>
    <label for="f_tags">Tags (comma separated, e.g. gardening, plumbing)</label>
    <input id="f_tags">
    <div class="actions">
      <button class="primary" id="save">Save</button>
      <button id="cancel" type="button">Cancel</button>
      <button class="danger" id="del" type="button" hidden>Delete</button>
    </div>
  </form>
</dialog>

<script>
// ---- 1. Paste your Supabase details here (see setup steps). Leave blank to try the app with local-only storage.
const SUPABASE_URL = "https://retlrbrclqdrlovsmmve.supabase.co";
const SUPABASE_KEY = "sb_publishable_rpDo0biiUme5uUAi7nw8tg_jZgiM0BN";

const TYPES = {
  tool:    {label:"Tool",    color:"var(--tool)",    fields:[["qty","Quantity","number"],["location","Where it is kept","text"],["renews","Expires / renews on","date"],["notes","Notes","area"]]},
  card:    {label:"Card",    color:"var(--card)",    fields:[["network","Card ID (last 4 digits only)","text"],["rules","Cashback rules, one per line (e.g. Amazon 5%)","area"],["renews","Expires / renews on","date"],["notes","Notes","area"]]},
  contact: {label:"Contact", color:"var(--contact)", fields:[["phone","Phone","tel"],["address","Address / area","text"],["notes","Notes","area"]]},
  waste:   {label:"To sell", color:"var(--waste)",   fields:[["qty","Quantity","number"],["location","Where it is kept","text"],["price","Asking price (₹)","number"],["notes","Notes","area"]]},
  task:    {label:"Task",    color:"#9f1239",        fields:[["due","Due date","date"],["done","Done","check"],["notes","Notes","area"]]},
  note:    {label:"Note",    color:"var(--note)",    fields:[["notes","Details","area"]]}
};
const $ = id => document.getElementById(id);
const sb = (SUPABASE_URL && SUPABASE_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let entries = [], typeFilter = null, tagFilter = null, editing = null, showDone = false, showAll = false;
const PAGES = {home:{label:"Home",types:null}, items:{label:"Items",types:["tool","waste"]}, cards:{label:"Cards",types:["card"]}, contacts:{label:"Contacts",types:["contact"]}, tasks:{label:"Tasks",types:["task"]}};
const curPage = () => { const h=(location.hash||"").replace("#",""); return PAGES[h] ? h : "home"; };
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = () => ymd(new Date());
const inDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const staleDone = e => e.type==="task" && e.data?.done && e.data?.doneAt && (Date.now()-new Date(e.data.doneAt).getTime() > 864e5);

// ---- storage: Supabase when configured, else this browser only
const Store = {
  async load(){
    if(sb){ const {data,error} = await sb.from("entries").select("*").order("created_at",{ascending:false}); if(error) throw error; return data; }
    return JSON.parse(localStorage.getItem("diary") || "[]");
  },
  async save(e){
    if(sb){ const {error} = await sb.from("entries").upsert(e); if(error) throw error; return; }
    const all = await this.load(); const i = all.findIndex(x=>x.id===e.id);
    i>=0 ? all[i]=e : all.unshift(e); localStorage.setItem("diary", JSON.stringify(all));
  },
  async remove(id){
    if(sb){ const {error} = await sb.from("entries").delete().eq("id",id); if(error) throw error; return; }
    const all = (await this.load()).filter(x=>x.id!==id); localStorage.setItem("diary", JSON.stringify(all));
  }
};

async function refresh(){
  try{ entries = await Store.load(); }
  catch(err){ $("notice").innerHTML = '<div class="notice">Could not load data: '+esc(err.message)+'. Check your Supabase URL, key and table setup.</div>'; return; }
  render();
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const text = e => [e.title, (e.tags||[]).join(" "), Object.values(e.data||{}).join(" ")].join(" ").toLowerCase();

function render(){
  if(!sb) $("notice").innerHTML = '<div class="notice">Local mode: data stays in this browser only. Add your Supabase details in index.html to sync across devices.</div>';
  const p = curPage(), pt = PAGES[p].types || Object.keys(TYPES);
  $("nav").innerHTML = Object.entries(PAGES).map(([k,v]) => `<a href="#${k}"${k===p?' aria-current="page"':""}>${v.label}</a>`).join("");
  const q = $("q").value.trim().toLowerCase();
  const base = entries.filter(e => pt.includes(e.type));
  let chips = pt.length>1 ? pt.map(k => `<button class="chip" data-type="${k}" aria-pressed="${typeFilter===k}">${TYPES[k].label}</button>`).join("") : "";
  if(p==="tasks") chips = `<button class="chip" data-showdone="1" aria-pressed="${showDone}">Show completed</button>`;
  $("types").innerHTML = chips;
  const tags = [...new Set(base.flatMap(e => e.tags||[]))].sort();
  $("tags").innerHTML = tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${tagFilter===t}">#${esc(t)}</button>`).join("");
  const shown = base.filter(e => (!typeFilter||e.type===typeFilter) && (!tagFilter||(e.tags||[]).includes(tagFilter)) && (!q||q.split(/\s+/).every(w => text(e).includes(w))) && (showDone||!staleDone(e)));
  if(p==="tasks") shown.sort((a,b) => (a.data?.done?1:0)-(b.data?.done?1:0) || String(a.data?.due||"9999").localeCompare(String(b.data?.due||"9999")));
  renderStrips(p);
  const showResults = showAll || Boolean(q||typeFilter||tagFilter);
  $("showAll").hidden = p!=="home"; $("showAll").textContent = showAll ? "Hide all" : "Show all"; $("showAll").setAttribute("aria-expanded", String(showAll));
  if(p==="home"||p==="cards") renderBest(q); else $("best").innerHTML = "";
  $("list").innerHTML = !showResults ? (p==="home" ? "" : '<div class="empty">List hidden. Search, tap a filter, or press Show all on Home.</div>') : shown.length ? shown.map(row).join("") : `<div class="empty">${entries.length ? "Nothing here. Try fewer words, or add an entry." : "No entries yet. Tap “Add entry” to start."}</div>`;
}

function renderStrips(p){
  if(p!=="home"){ $("strips").innerHTML = ""; return; }
  const t = todayStr(), lim = inDays(30);
  const due = entries.filter(e => e.type==="task" && !e.data?.done && e.data?.due && e.data.due<=t).sort((a,b) => a.data.due.localeCompare(b.data.due));
  const ren = entries.filter(e => e.data?.renews && e.data.renews<=lim).sort((a,b) => a.data.renews.localeCompare(b.data.renews));
  const li = (e,label) => `<li><button class="linkbtn" data-open="${e.id}">${esc(e.title)}</button> <span>${label}</span></li>`;
  let h = "";
  if(due.length) h += `<div class="strip"><b>Due today / overdue</b><ul>${due.map(e => li(e, e.data.due<t ? "⚠ overdue since "+esc(e.data.due) : "due today")).join("")}</ul></div>`;
  if(ren.length) h += `<div class="strip"><b>Coming up (next 30 days)</b><ul>${ren.map(e => li(e, e.data.renews<t ? "⚠ expired "+esc(e.data.renews) : "on "+esc(e.data.renews))).join("")}</ul></div>`;
  $("strips").innerHTML = h;
}

function row(e){
  const t = TYPES[e.type] || TYPES.note, d = e.data || {}, td = todayStr();
  const stepper = `<span class="stepper"><button type="button" class="step" data-d="-1" aria-label="Decrease quantity">−</button><span class="q">${esc(d.qty ?? 0)}</span><button type="button" class="step" data-d="1" aria-label="Increase quantity">+</button></span>`;
  const ren = d.renews ? esc("🔁 "+(d.renews<td ? "Expired " : "Renews ")+d.renews) : "";
  const L = []; let side = "";
  if(e.type==="tool"){ side = stepper; L.push(d.location && esc("📍 "+d.location), ren, esc(d.notes||"")); }
  else if(e.type==="waste"){ side = stepper; L.push(d.location && esc("📍 "+d.location), d.price && esc("Asking ₹"+d.price), esc(d.notes||"")); }
  else if(e.type==="card"){ L.push(d.network && esc("Card "+d.network), esc(d.rules||""), ren, esc(d.notes||"")); }
  else if(e.type==="contact"){
    const phones = String(d.phone||"").split(/[,;/]+/).map(s=>s.trim()).filter(Boolean).map(s => `<a href="tel:${esc(s.replace(/[^\d+]/g,""))}">${esc(s)}</a>`).join(", ");
    const addr = d.address ? `<a href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(d.address)}" target="_blank" rel="noopener">📍 ${esc(d.address)}</a>` : "";
    L.push(phones, addr, esc(d.notes||""));
  }
  else if(e.type==="task"){
    side = `<input type="checkbox" class="tick" aria-label="Mark ${esc(e.title)} done"${d.done?" checked":""}>`;
    L.push(d.due && esc((!d.done && d.due<td ? "⚠ Overdue · " : "Due ")+d.due), esc(d.notes||""));
  }
  else L.push(esc(d.notes||""));
  const strike = e.type==="task" && d.done ? ' style="text-decoration:line-through"' : "";
  return `<div class="row" role="button" tabindex="0" data-id="${e.id}"><i style="background:${t.color}"></i><span class="body"><div class="t"${strike}>${esc(e.title)}</div><div class="d">${L.filter(Boolean).join("\n")}</div><div class="tags">${(e.tags||[]).map(x=>"#"+esc(x)).join(" ")}</div></span><span class="side">${side}</span></div>`;
}

// "Which card?" ranking: when the search matches a rule line on a card, rank cards by that percentage
function renderBest(q){
  if(!q){ $("best").innerHTML=""; return; }
  const hits = [];
  entries.filter(e=>e.type==="card").forEach(c => {
    (String(c.data?.rules||"").split("\n")).forEach(line => {
      if(line.toLowerCase().includes(q)){ const m = line.match(/(\d+(?:\.\d+)?)\s*%/); if(m) hits.push({card:c.title, pct:parseFloat(m[1]), line:line.trim()}); }
    });
  });
  hits.sort((a,b)=>b.pct-a.pct);
  $("best").innerHTML = hits.length ? `<div class="best"><b>Best card for “${esc(q)}”</b><ol>${hits.map(h=>`<li>${esc(h.card)}: ${esc(h.line)}</li>`).join("")}</ol></div>` : "";
}

// ---- add / edit dialog
function buildFields(type, data={}){
  $("dyn").innerHTML = TYPES[type].fields.map(([k,l,kind]) => kind==="check"
    ? `<label class="chk"><input id="d_${k}" type="checkbox"${data[k]?" checked":""}> ${l}</label>`
    : `<label for="d_${k}">${l}</label>` + (kind==="area" ? `<textarea id="d_${k}">${esc(data[k])}</textarea>` : `<input id="d_${k}" type="${kind}" value="${esc(data[k])}">`)
  ).join("");
}
function openDlg(e){
  editing = e || null;
  $("f_type").innerHTML = Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.label}</option>`).join("");
  const pt = PAGES[curPage()].types; $("f_type").value = e ? e.type : (typeFilter || (pt ? pt[0] : "tool"));
  $("f_title").value = e ? e.title : "";
  $("f_tags").value = e ? (e.tags||[]).join(", ") : (tagFilter || "");
  buildFields($("f_type").value, e ? e.data : {});
  $("dlgTitle").textContent = e ? "Edit entry" : "Add entry";
  $("del").hidden = !e;
  $("dlg").showModal(); $("f_title").focus();
}
async function save(){
  if(!$("f_title").value.trim()){ $("f_title").focus(); return; }
  const type = $("f_type").value, data = {};
  TYPES[type].fields.forEach(([k,,kind]) => { const el = $("d_"+k); if(kind==="check"){ if(el.checked) data[k] = true; } else { const v = el.value.trim(); if(v!=="") data[k] = v; } });
  if(type==="task" && data.done) data.doneAt = editing?.data?.doneAt || new Date().toISOString();
  const entry = {
    id: editing ? editing.id : crypto.randomUUID(), type, title: $("f_title").value.trim(), data,
    tags: $("f_tags").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean),
    created_at: editing ? editing.created_at : new Date().toISOString()
  };
  try{ await Store.save(entry); $("dlg").close(); await refresh(); }
  catch(err){ alert("Could not save: "+err.message); }
}

// ---- events
$("q").addEventListener("input", () => { showAll = false; render(); });
$("add").onclick = () => openDlg();
$("showAll").onclick = () => { showAll = !showAll; if(showAll){ $("q").value = ""; typeFilter = null; tagFilter = null; } render(); };
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = save;
$("f_type").onchange = () => buildFields($("f_type").value);
$("del").onclick = async () => { if(editing && confirm("Delete “"+editing.title+"”?")){ try{ await Store.remove(editing.id); $("dlg").close(); await refresh(); }catch(err){ alert("Could not delete: "+err.message); } } };
$("list").onclick = async ev => {
  if(ev.target.closest("a")) return;
  const tk = ev.target.closest(".tick");
  if(tk){
    const e = entries.find(x=>x.id===tk.closest(".row").dataset.id); if(!e) return;
    const nd = {...e.data};
    if(!nd.done){ nd.done = true; nd.doneAt = new Date().toISOString(); } else { delete nd.done; delete nd.doneAt; }
    e.data = nd; render();
    try{ await Store.save(e); } catch(err){ alert("Could not save: "+err.message); refresh(); }
    return;
  }
  const st = ev.target.closest(".step");
  if(st){
    const e = entries.find(x=>x.id===st.closest(".row").dataset.id); if(!e) return;
    const n = Math.max(0, (parseInt(e.data?.qty,10)||0) + parseInt(st.dataset.d,10));
    e.data = {...e.data, qty:n}; render();
    try{ await Store.save(e); } catch(err){ alert("Could not save: "+err.message); refresh(); }
    return;
  }
  const b = ev.target.closest(".row"); if(b) openDlg(entries.find(x=>x.id===b.dataset.id));
};
$("list").onkeydown = ev => { if(ev.key==="Enter" && ev.target.classList.contains("row")) openDlg(entries.find(x=>x.id===ev.target.dataset.id)); };
$("strips").onclick = ev => { const b = ev.target.closest("[data-open]"); if(b) openDlg(entries.find(x=>x.id===b.dataset.open)); };
$("types").onclick = ev => { if(ev.target.closest("[data-showdone]")){ showDone = !showDone; render(); return; } const b = ev.target.closest("[data-type]"); if(b){ showAll = false; typeFilter = typeFilter===b.dataset.type ? null : b.dataset.type; render(); } };
$("tags").onclick = ev => { const b = ev.target.closest("[data-tag]"); if(b){ showAll = false; tagFilter = tagFilter===b.dataset.tag ? null : b.dataset.tag; render(); } };

window.addEventListener("hashchange", () => { typeFilter = null; tagFilter = null; $("q").value = ""; render(); window.scrollTo(0,0); });

/* EXPORT/IMPORT DISABLED until email login is added. Re-enable with the HTML buttons above.
// ---- export / import
function dl(name, mime, content){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content],{type:mime})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
$("expJson").onclick = () => dl(`smart-diary-${todayStr()}.json`, "application/json", JSON.stringify(entries.map(({id,type,title,tags,data,created_at}) => ({id,type,title,tags,data,created_at})), null, 2));
$("expCsv").onclick = () => {
  const keys = [...new Set(entries.flatMap(e => Object.keys(e.data||{})))], cols = ["type","title","tags","created_at", ...keys];
  const c = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const val = (e,k) => k==="tags" ? (e.tags||[]).join("; ") : (["type","title","created_at"].includes(k) ? e[k] : (e.data||{})[k]);
  const rows = [cols.map(c).join(",")].concat(entries.map(e => cols.map(k => c(val(e,k))).join(",")));
  dl(`smart-diary-${todayStr()}.csv`, "text/csv;charset=utf-8", "\ufeff" + rows.join("\r\n"));
};
$("impBtn").onclick = () => $("impFile").click();
$("impFile").onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  try{
